version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tne_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tne_network

  app:
    build: ./backEnd
    container_name: tne_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://localhost:30080 
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backEnd:/var/www/html
    networks:
      - tne_network

  web:
    build:
      context: ./frontEnd/
      args:
        VITE_API_URL: /api   
    container_name: tne_frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "30080:80"
    networks:
      - tne_network

volumes:
  postgres_data:

networks:
  tne_network:
    driver: bridge
